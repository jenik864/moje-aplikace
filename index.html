<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hlavouni</title>
<meta name="description" content="Fotbal velkých hlav pro jednoho nebo dva hráče: 1 v 1 nebo 2 v 2.">
<meta name="theme-color" content="#0b1324">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Lilita+One&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- HRA:START -->
<div id="app">
  <canvas id="game" aria-label="Hřiště"></canvas>

  <div id="hud">
    <button id="btn-pause" class="icon-btn" type="button" aria-label="Pauza" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="btn-mute" class="icon-btn" type="button" aria-label="Vypnout zvuk" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="m16.5 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </div>

  <div id="touch" hidden></div>

  <section id="menu" class="overlay" aria-labelledby="logo">
    <div class="panel menu-panel">
      <header class="brand">
        <h1 id="logo" class="logo" aria-label="Hlavouni">HLAV<svg class="logo-ball" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f7f8fa" stroke="#0b1220" stroke-width="3"/><path d="M20 12.5l7 5.1-2.7 8.2h-8.6L13 17.6z" fill="#0b1220"/><path d="M20 12.5V3M27 17.6l8.6-3M24.3 25.8l5.3 7.4M15.7 25.8l-5.3 7.4M13 17.6l-8.6-3" stroke="#0b1220" stroke-width="2.4" fill="none"/></svg>UNI</h1>
        <p class="tagline">Fotbal velkých hlav</p>
      </header>

      <div class="opts">
        <div class="opt">
          <span class="opt-label" id="lbl-format">Zápas</span>
          <div class="seg" role="group" aria-labelledby="lbl-format" data-key="format">
            <button type="button" data-v="1v1">1 v 1</button>
            <button type="button" data-v="2v2">2 v 2</button>
          </div>
        </div>
        <div class="opt">
          <span class="opt-label" id="lbl-players">Hráči</span>
          <div class="seg" role="group" aria-labelledby="lbl-players" data-key="players">
            <button type="button" data-v="1p">1 hráč</button>
            <button type="button" data-v="pvp">2 proti sobě</button>
            <button type="button" data-v="coop" id="opt-coop">2 spolu</button>
          </div>
        </div>
        <div class="opt" id="row-level">
          <span class="opt-label" id="lbl-level">Počítač</span>
          <div class="seg" role="group" aria-labelledby="lbl-level" data-key="level">
            <button type="button" data-v="easy">Lehký</button>
            <button type="button" data-v="medium">Střední</button>
            <button type="button" data-v="hard">Těžký</button>
          </div>
        </div>
        <div class="opt">
          <span class="opt-label" id="lbl-time">Délka</span>
          <div class="seg" role="group" aria-labelledby="lbl-time" data-key="minutes">
            <button type="button" data-v="1">1 min</button>
            <button type="button" data-v="2">2 min</button>
            <button type="button" data-v="3">3 min</button>
          </div>
        </div>
      </div>

      <button id="btn-play" class="btn-play" type="button">Hrát</button>
      <div id="controls-help" class="help" aria-live="polite"></div>
    </div>
  </section>

  <section id="pause" class="overlay" aria-labelledby="pause-title" hidden>
    <div class="panel small-panel">
      <h2 id="pause-title" class="panel-title">Pauza</h2>
      <div class="stack">
        <button id="btn-resume" class="btn-play" type="button">Pokračovat</button>
        <button id="btn-restart" class="btn" type="button">Hrát znovu</button>
        <button id="btn-quit" class="btn" type="button">Do menu</button>
      </div>
    </div>
  </section>

  <section id="result" class="overlay" aria-labelledby="res-title" hidden>
    <div class="panel small-panel">
      <p id="res-kicker" class="res-kicker">Konec zápasu</p>
      <h2 id="res-title" class="res-title">Výhra!</h2>
      <p class="res-score"><span id="res-a" class="t0">0</span><span class="colon">:</span><span id="res-b" class="t1">0</span></p>
      <p id="res-sub" class="res-sub"></p>
      <div class="stack">
        <button id="btn-again" class="btn-play" type="button">Hrát znovu</button>
        <button id="btn-menu" class="btn" type="button">Do menu</button>
      </div>
    </div>
  </section>

  <div id="rotate" class="rotate" hidden>Otoč telefon na šířku</div>
  <noscript><p class="noscript">Hra potřebuje zapnutý JavaScript.</p></noscript>
</div>
<!-- HRA:END -->
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/ai.js"></script>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
